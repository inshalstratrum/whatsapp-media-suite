[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-media-suite"
version = "1.0.0"
description = "All-in-one WhatsApp media manager: organize by contact, find duplicates, restore EXIF dates, clean storage, save statuses, live watcher. Single integrated GUI + CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Inshal Ijaz" }]
keywords = ["whatsapp", "media", "organizer", "cleaner", "duplicates", "exif", "status-saver"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["piexif>=1.1"]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0"]

[project.scripts]
whatsapp-media-suite = "wmsuite.__main__:main"

[tool.setuptools.packages.find]
include = ["wmsuite*"]
