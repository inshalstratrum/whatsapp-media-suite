name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip 2>&1 | Tee-Object -FilePath ci-install.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pip install -r requirements.txt 2>&1 | Tee-Object -FilePath ci-install.log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pip install pyinstaller 2>&1 | Tee-Object -FilePath ci-install.log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath ci-tests.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name WhatsAppMediaSuite wmsuite_launch.py 2>&1 | Tee-Object -FilePath ci-build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppMediaSuite-windows
          path: dist/WhatsAppMediaSuite.exe
          if-no-files-found: error

      - name: Attach exe to release (on version tags)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/WhatsAppMediaSuite.exe

      - name: Publish exe to GitHub Release (main builds)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2.0 "dist/WhatsAppMediaSuite.exe" --repo "$env:GITHUB_REPOSITORY" --title "WhatsApp Media Suite v2.2.0" --notes "v2.2.0: collapsible activity log, visual galleries with side-by-side duplicate comparison, and organize media by contact via the encrypted chat backup. Dry-run by default, 100% offline." || gh release upload v2.2.0 "dist/WhatsAppMediaSuite.exe" --clobber --repo "$env:GITHUB_REPOSITORY"

      - name: Record successful build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          New-Item -ItemType Directory -Force -Path .build | Out-Null
          "sha: $env:GITHUB_SHA" | Out-File -FilePath .build/last-success.txt -Encoding utf8
          "run: $env:GITHUB_RUN_ID" | Add-Content -Path .build/last-success.txt
          "utc: $([DateTime]::UtcNow.ToString('o'))" | Add-Content -Path .build/last-success.txt
          "artifact: WhatsAppMediaSuite-windows" | Add-Content -Path .build/last-success.txt
          git add .build/last-success.txt
          git commit -m "ci: record successful exe build [skip ci]"
          git push

      - name: Report failure as issue
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "Windows build workflow failed." | Out-File -FilePath issue-body.txt -Encoding utf8
          "" | Add-Content -Path issue-body.txt
          "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Add-Content -Path issue-body.txt
          "Commit: $env:GITHUB_SHA" | Add-Content -Path issue-body.txt
          "--- ci-install.log (tail 60) ---" | Add-Content -Path issue-body.txt
          Get-Content ci-install.log -Tail 60 -ErrorAction SilentlyContinue | Add-Content -Path issue-body.txt
          "--- ci-tests.log (tail 150) ---" | Add-Content -Path issue-body.txt
          Get-Content ci-tests.log -Tail 150 -ErrorAction SilentlyContinue | Add-Content -Path issue-body.txt
          "--- ci-build.log (tail 80) ---" | Add-Content -Path issue-body.txt
          Get-Content ci-build.log -Tail 80 -ErrorAction SilentlyContinue | Add-Content -Path issue-body.txt
          gh issue create --repo "$env:GITHUB_REPOSITORY" --title "Windows build failed (run $env:GITHUB_RUN_ID)" --body-file issue-body.txt
