name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build exe with PyInstaller
        run: pyinstaller --noconfirm --onefile --windowed --name WhatsAppMediaSuite wmsuite_launch.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppMediaSuite-windows
          path: dist/WhatsAppMediaSuite.exe
          if-no-files-found: error

      - name: Attach exe to release (on version tags)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/WhatsAppMediaSuite.exe
