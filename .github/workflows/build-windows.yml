name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build exe with PyInstaller
        run: pyinstaller --noconfirm --onefile --windowed --name WhatsAppMediaSuite wmsuite_launch.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppMediaSuite-windows
          path: dist/WhatsAppMediaSuite.exe
          if-no-files-found: error

      - name: Attach exe to release (on version tags)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/WhatsAppMediaSuite.exe

      - name: Record successful build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          New-Item -ItemType Directory -Force -Path .build | Out-Null
          "sha: $env:GITHUB_SHA" | Out-File -FilePath .build/last-success.txt -Encoding utf8
          "run: $env:GITHUB_RUN_ID" | Add-Content -Path .build/last-success.txt
          "utc: $([DateTime]::UtcNow.ToString('o'))" | Add-Content -Path .build/last-success.txt
          "artifact: WhatsAppMediaSuite-windows" | Add-Content -Path .build/last-success.txt
          git add .build/last-success.txt
          git commit -m "ci: record successful exe build [skip ci]"
          git push

      - name: Report failure as issue
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          "Windows build workflow failed." | Out-File -FilePath issue-body.txt -Encoding utf8
          "" | Add-Content -Path issue-body.txt
          "Run: https://github.com/$env:REPO/actions/runs/$env:GITHUB_RUN_ID" | Add-Content -Path issue-body.txt
          "Commit: $env:GITHUB_SHA" | Add-Content -Path issue-body.txt
          "" | Add-Content -Path issue-body.txt
          "Failed-step logs:" | Add-Content -Path issue-body.txt
          gh run view $env:GITHUB_RUN_ID --repo $env:REPO --log-failed | Add-Content -Path issue-body.txt
          gh issue create --repo $env:REPO --title "Windows build failed (run $env:GITHUB_RUN_ID)" --body-file issue-body.txt
